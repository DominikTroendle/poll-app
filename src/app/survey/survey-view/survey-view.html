<section class="survey-view">
  @if (currentSurvey(); as survey) {
    <div class="survey-view__header-wrapper">
      <div class="survey-view__header">
        <div class="survey-view__status">
          <app-survey-status
            class="survey-view__status-badge"
            [surveyEndDate]="survey.ends_at"
            [displayMode]="surveyExpired() ? 'expired' : 'published'"
          ></app-survey-status>
          <button class="survey-view__close-button" routerLink="/">
            <img src="svg/close.svg" />
          </button>
        </div>
        <div class="survey-view__meta">
          <span>Ends on {{ formatDate(survey.ends_at) }}</span>
          <span>Category: {{ survey.category }}</span>
        </div>
        <h2 class="survey-view__title">{{ survey.title }}</h2>
      </div>
      <p class="survey-view__description">{{ survey.description }}</p>
    </div>
    <app-survey-form
      class="survey-view__form"
      [questions]="survey.questions"
      [disabled]="surveyExpired()"
    ></app-survey-form>
  }
</section>
<app-survey-results class="survey-view__results" [expired]="surveyExpired()"></app-survey-results>
