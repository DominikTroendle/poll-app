<section class="survey-results">
  <button class="survey-results__button" (click)="toggleResultsVisibility()">
    <span>{{ buttonText }}</span>
    <img class="survey-results__arrow" [src]="getImgSrc" />
  </button>
  <div class="survey-results__container" [class.survey-results__container--open]="isOpen">
    <h2 class="survey-results__title">
      Survey results
      @if (!expired()) {
        <span class="survey-results__prefix">LIVE</span>
      }
    </h2>
    <div class="survey-results__wrapper">
      @for (question of questions(); track question.id) {
        <app-survey-result
          [questionResults]="getQuestionResults(question.id)"
          [question]="question"
          [questionId]="$index + 1"
        ></app-survey-result>
      }
    </div>
  </div>
</section>
