<label class="survey-input" [for]="'answer-' + answer().id">
  <input
    class="survey-input__control"
    [type]="multiSelect() ? 'checkbox' : 'radio'"
    [name]="'question-' + answer().question_id"
    [id]="'answer-' + answer().id"
    [value]="answer().id"
  />
  <p class="survey-input__label">
    <span class="survey-input__prefix">{{ getAnswerLetter() }}.</span>{{ answer().answer }}
  </p>
</label>
