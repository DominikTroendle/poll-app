<label class="survey-input" [for]="answer().id">
  <input
    class="survey-input__control"
    type="checkbox"
    name=""
    [id]="answer().id"
    [value]="answer().answer"
  />
  <p class="survey-input__label">
    <span class="survey-input__prefix">{{ getAnswerLetter() }}.</span>{{ answer().answer }}
  </p>
</label>
