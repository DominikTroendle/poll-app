<form class="survey-form" action="">
  @for (question of questions(); track question.id) {
    <app-survey-question class="survey-form__question"></app-survey-question>
  }
</form>
<app-button-primary
  class="survey-form__button"
  [buttonText]="completeSurveyButtonText"
  [hasIcon]="false"
></app-button-primary>
