<section class="create-survey">
  <div class="create-survey__wrapper">
    <div class="create-survey__header">
      <div class="create-survey__status">
        <app-survey-status></app-survey-status>
        <button class="create-survey__close-button" routerLink="/">
          <img src="svg/close-white.svg" />
        </button>
      </div>
      <h2 class="create-survey__title">Create new survey</h2>
    </div>
    <form class="create-survey__form" action="">
      <app-create-survey-field
        class="create-survey__field"
        [fieldTitle]="'Survey name'"
        [fieldType]="'text'"
      ></app-create-survey-field>
      <app-category-dropdown></app-category-dropdown>
      <app-create-survey-field
        class="create-survey__field"
        [fieldTitle]="'Set end date'"
        [fieldOptional]="true"
        [fieldType]="'text'"
      ></app-create-survey-field>
      <app-create-survey-field
        class="create-survey__field"
        [fieldTitle]="'Describing text'"
        [fieldOptional]="true"
        [fieldType]="'textarea'"
      ></app-create-survey-field>
      <app-create-survey-question></app-create-survey-question>
      <button>Add next question</button>
    </form>
  </div>
  <app-button-primary
    class="create-survey__button"
    [buttonText]="createSurveyButtonText"
  ></app-button-primary>
</section>
