<section class="create-survey">
  <div class="create-survey__wrapper">
    <div class="create-survey__header">
      <div class="create-survey__status">
        <app-survey-status></app-survey-status>
        <button class="create-survey__close-button" routerLink="/">
          <img src="svg/close-white.svg" />
        </button>
      </div>
      <h2 class="create-survey__title">Create new survey</h2>
    </div>
    <form class="create-survey__form" action="" (click)="closeCategoryDropdown()">
      <app-create-survey-field
        class="create-survey__field"
        [fieldTitle]="'Survey name'"
        [fieldType]="'text'"
      ></app-create-survey-field>
      <app-category-dropdown
        class="create-survey__dropdown"
        [isOpen]="isCategoryDropdownOpen"
        (toggleRequested)="toggleCategoryDropdown()"
        (click)="$event.stopPropagation()"
        [dropdownText]="dropdownChooseText"
      ></app-category-dropdown>
      <app-create-survey-field
        class="create-survey__field"
        [fieldTitle]="'Set end date'"
        [fieldOptional]="true"
        [fieldType]="'text'"
      ></app-create-survey-field>
      <app-create-survey-field
        class="create-survey__field"
        [fieldTitle]="'Describing text'"
        [fieldOptional]="true"
        [fieldType]="'textarea'"
      ></app-create-survey-field>
      @for (question of questions; track question.id) {
        <app-create-survey-question
          class="create-survey__question"
          [questionNumber]="question.id"
        ></app-create-survey-question>
      }
      <button class="create-survey__button-add-question" type="button" (click)="addQuestion()">
        Add next question
        <img class="create-survey__icon-add-question" src="svg/plus-icon.svg" />
      </button>
    </form>
  </div>
  <app-button-primary
    class="create-survey__button"
    [buttonText]="createSurveyButtonText"
  ></app-button-primary>
</section>
