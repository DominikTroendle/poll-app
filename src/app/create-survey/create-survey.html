<section class="create-survey">
  <div class="create-survey__overlay" [class.create-survey__overlay--visible]="isPublished">
    <div class="create-survey__published">Survey<br />successfully published!</div>
  </div>
  <div class="create-survey__wrapper">
    <div class="create-survey__header">
      <div class="create-survey__status">
        <app-survey-status [displayMode]="'draft'"></app-survey-status>
        <button class="create-survey__close-button" routerLink="/">
          <span>Cancel</span>
          <img src="svg/close-white.svg" />
        </button>
      </div>
      <h2 class="create-survey__title">Create new survey</h2>
    </div>
    <form
      class="create-survey__form"
      action=""
      (click)="closeCategoryDropdown()"
      [formGroup]="newSurvey"
      (ngSubmit)="onSubmit()"
    >
      <div class="create-survey__field-wrapper">
        <div class="create-survey__details">
          <app-create-survey-field
            class="create-survey__field create-survey__field--name"
            [field]="surveyNameField"
            [control]="newSurvey.controls.title"
          ></app-create-survey-field>
          <div class="create-survey__date-category-row">
            <app-category-dropdown
              class="create-survey__dropdown"
              [isOpen]="isCategoryDropdownOpen"
              (toggleRequested)="toggleCategoryDropdown()"
              (click)="$event.stopPropagation()"
              [dropdownText]="dropdownChooseText"
              (categorySelected)="selectCategory($event)"
              [control]="newSurvey.controls.category"
            ></app-category-dropdown>
            <app-create-survey-field
              class="create-survey__field create-survey__field--date"
              [field]="endDateField"
              [control]="newSurvey.controls.endDate"
            ></app-create-survey-field>
          </div>
          <app-create-survey-field
            class="create-survey__field create-survey__field--description"
            [field]="descriptionField"
            [control]="newSurvey.controls.description"
          ></app-create-survey-field>
        </div>
        <div class="create-survey__questions-wrapper">
          @for (questionControl of newSurvey.controls.questions.controls; track questionControl) {
            <app-create-survey-question
              class="create-survey__question"
              [questionNumber]="$index + 1"
              [surveyQuestionControl]="questionControl"
            ></app-create-survey-question>
          }
        </div>
        <button class="create-survey__button-add-question" type="button" (click)="addQuestion()">
          Add next question
          <img class="create-survey__icon-add-question" src="svg/plus-icon.svg" />
        </button>
      </div>
      <app-button-primary
        class="create-survey__button"
        [buttonText]="createSurveyButtonText"
        [buttonType]="'submit'"
      ></app-button-primary>
    </form>
  </div>
</section>
