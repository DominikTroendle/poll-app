<div
  class="create-survey-field"
  [class.create-survey-field--answer]="layout === 'answer'"
  [class.create-survey-field--centered]="field().name != 'description'"
>
  <label class="create-survey-field__label" [for]="field().id"
    >{{ field().title }}
    <span class="create-survey-field__highlight">{{ optionalText }}</span></label
  >
  <button class="create-survey-field__action" type="button">
    <img src="svg/delete.svg" />
  </button>
  @if (type === 'text') {
    @let controlError = control().hasError('required') && (control().touched || control().dirty);
    <input
      class="create-survey-field__input"
      [id]="field().id"
      [name]="field().name"
      [style.height]="'37px'"
      [formControl]="control()"
      [placeholder]="controlError ? 'This field is required' : ''"
    />
  } @else {
    <textarea
      class="create-survey-field__input"
      [id]="field().id"
      [name]="field().name"
      [style.height]="'108px'"
      [formControl]="control()"
    ></textarea>
  }
</div>
