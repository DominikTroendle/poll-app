<div class="create-survey-field" [class.create-survey-field--answer]="fieldLayout() === 'answer'">
  <label class="create-survey-field__label" for="survey-name"
    >{{ fieldTitle() }}
    <span class="create-survey-field__highlight">{{ getFieldOptionalText }}</span></label
  >
  <button class="create-survey-field__action" type="button">
    <img src="svg/delete.svg" />
  </button>
  @if (fieldType() === 'text') {
    <input
      class="create-survey-field__input"
      id="survey-name"
      name="surveyName"
      [style.height]="'37px'"
    />
  } @else {
    <textarea
      class="create-survey-field__input"
      name="surveyName"
      id="survey-name"
      [style.height]="'108px'"
    ></textarea>
  }
</div>
