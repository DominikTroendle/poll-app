<fieldset class="create-survey-question">
  <div class="create-survey-question__question">
    <div class="create-survey-question__header">
      <label class="create-survey-question__title" for="question-title"
        >{{ questionNumber() }}. Question</label
      >
      <button class="create-survey-question__action">
        <img src="svg/delete.svg" />
      </button>
    </div>
    @let questionTitleError =
      surveyQuestionControl().controls.title.hasError('required') &&
      (surveyQuestionControl().controls.title.touched ||
        surveyQuestionControl().controls.title.dirty);
    <input
      class="create-survey-question__input"
      type="text"
      id="question-title"
      [formControl]="surveyQuestionControl().controls.title"
      [placeholder]="questionTitleError ? 'This field is required' : ''"
    />
  </div>
  <div class="create-survey-question__answers">
    <div class="create-survey-question__answers-header">
      <span class="create-survey-question__answers-title">Answers</span>
      <div class="create-survey-question__checkbox">
        <input
          type="checkbox"
          id="multi-select"
          [formControl]="surveyQuestionControl().controls.multiSelect"
        />
        <label for="multi-select"></label>
        <span>Allow multiple answers</span>
      </div>
    </div>
    @for (answer of answers; track answer.id; let answerControlIndex = $index) {
      <app-create-survey-field
        class="create-survey-question__field"
        [field]="getAnswerField(answer)"
        [control]="surveyQuestionControl().controls.answers.controls[answerControlIndex]"
      ></app-create-survey-field>
    }
    <button class="create-survey-question__button-add" type="button" (click)="addAnswer()">
      Add answer
      <img class="create-survey-question__icon-add" src="svg/plus-icon.svg" />
    </button>
  </div>
</fieldset>
