<div class="category-dropdown">
  <button
    class="category-dropdown__button"
    type="button"
    [class.category-dropdown__button--selected]="isCategorySelected()"
    (click)="requestToggle()"
  >
    <span>{{ dropdownText() }}</span>
    <img [src]="getImgSrc" />
  </button>
  <p
    class="category-dropdown__selected"
    [class.category-dropdown__selected--visible]="isCategorySelected()"
  >
    {{ selectedCategory }}
  </p>
  <ul class="category-dropdown__content" [class.category-dropdown__content--visible]="isOpen()">
    @for (category of categories; track category) {
      <li
        class="category-dropdown__category"
        [class.category-dropdown__category--selected]="selectedCategory === category"
        (click)="setCategory(category)"
      >
        {{ category }}
      </li>
    }
  </ul>
</div>
