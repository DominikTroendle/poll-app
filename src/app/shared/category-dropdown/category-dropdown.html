<div class="category-dropdown">
    <button class="category-dropdown__button" (click)="requestToggle()">
        <span>Sort by categories</span>
        <img [src]="getImgSrc">
    </button>
    <p class="category-dropdown__selected" [class.category-dropdown__selected--visible]="isCategorySelected()">{{ selectedCategory }}</p>
    <ul class="category-dropdown__content" [class.category-dropdown__content--visible]="isOpen()">
        <li>TestCategory1</li>
        <li>TestCategory2</li>
        <li>TestCategory3</li>
        <li>TestCategory4</li>
        <li>TestCategory5</li>
    </ul>
</div>
