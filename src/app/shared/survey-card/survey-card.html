<div class="survey-card">
  <div class="survey-card__header">
    <p class="survey-card__category">{{ surveyMetaData().category }}</p>
    <h4 class="survey-card__title">{{ surveyMetaData().title }}</h4>
  </div>
  <app-survey-status
    class="survey-card__status"
    [surveyEndDate]="surveyMetaData().ends_at"
  ></app-survey-status>
</div>
