<div class="survey-status">
  @switch (getRemainingDays()) {
    @case (0) {
      <span class="survey-status__text">Ends today</span>
    }
    @case (1) {
      <span class="survey-status__text">Ends in {{ getRemainingDays() }} Day</span>
    }
    @default {
      <span class="survey-status__text">Ends in {{ getRemainingDays() }} Days</span>
    }
  }
</div>
