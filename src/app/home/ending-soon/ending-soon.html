<section class="ending-soon">
  <h3 class="ending-soon__title">Ending soon surveys</h3>
  <div class="ending-soon__card-wrapper">
    @for (survey of endingSoonSurveys(); track survey.id) {
      <app-survey-card
        class="ending-soon__card"
        [routerLink]="['survey', survey.id]"
      ></app-survey-card>
    }
  </div>
</section>
